name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["18", "20", "22"]
        # The plugin's helper scripts and MCP bridge run wherever Claude Code
        # runs, so the lowest supported Node (package.json `engines`) and
        # Windows both have to stay green.
        include:
          - os: windows-latest
            node: "22"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The plugin is dependency-free: there is nothing to install, and no
      # lockfile to cache.
      - run: npm run check
      - run: npm test --if-present

  ci:
    # One stable check for branch protection to require, so the matrix above can
    # gain or drop entries without anyone reconfiguring the protected branch.
    name: ci
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Require every test job to have passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test jobs finished with: ${{ needs.test.result }}"
            exit 1
          fi
          echo "All test jobs passed."

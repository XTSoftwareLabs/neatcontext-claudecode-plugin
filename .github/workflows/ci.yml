name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["18", "20", "22"]
        # The plugin's helper scripts and MCP bridge run wherever Claude Code
        # runs, so the lowest supported Node (package.json `engines`) and
        # Windows both have to stay green.
        include:
          - os: windows-latest
            node: "22"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # The plugin is dependency-free: there is nothing to install, and no
      # lockfile to cache.
      - run: npm run check
      - run: npm test --if-present

  coverage:
    # Every line a pull request adds to src/ has to be run by a test. Whole
    # -file numbers are not the bar: plenty of this code predates the suite. The
    # bar is that new code arrives with a test that exercises it.
    name: diff coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          # The gate diffs against the base commit, which a shallow clone of the
          # merge ref does not have.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node tools/diff-coverage.mjs --base ${{ github.event.pull_request.base.sha }}

  marketplace:
    name: marketplace validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # The community marketplace review pipeline uses Claude Code's validator.
      # Use its current release here so schema changes fail before submission.
      - run: npm install --global @anthropic-ai/claude-code@latest
      - run: npm run validate:plugin

  ci:
    # One stable check for branch protection to require, so the matrix above can
    # gain or drop entries without anyone reconfiguring the protected branch.
    name: ci
    runs-on: ubuntu-latest
    needs: [test, coverage, marketplace]
    if: always()
    steps:
      - name: Require every test job to have passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test jobs finished with: ${{ needs.test.result }}"
            exit 1
          fi
          # Skipped on a push to main, where there is no pull request to diff.
          if [ "${{ needs.coverage.result }}" != "success" ] \
            && [ "${{ needs.coverage.result }}" != "skipped" ]; then
            echo "diff coverage finished with: ${{ needs.coverage.result }}"
            exit 1
          fi
          if [ "${{ needs.marketplace.result }}" != "success" ]; then
            echo "marketplace validation finished with: ${{ needs.marketplace.result }}"
            exit 1
          fi
          echo "All CI jobs passed."
